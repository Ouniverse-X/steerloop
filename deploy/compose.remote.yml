name: steerloop

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STEERLOOP_TOKEN_FILE: /run/secrets/relay_token
      STEERLOOP_RELAY_HOST: 0.0.0.0
      STEERLOOP_RELAY_PORT: 8787
      STEERLOOP_JOURNAL_PATH: /data/relay-events.jsonl
      STEERLOOP_JOURNAL_SYNC: "true"
      STEERLOOP_MAX_HISTORY: ${STEERLOOP_MAX_HISTORY:-2000}
    secrets:
      - relay_token
    volumes:
      - relay-data:/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STEERLOOP_DOMAIN: ${STEERLOOP_DOMAIN:?Set STEERLOOP_DOMAIN in deploy/.env}
    depends_on:
      relay:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

secrets:
  relay_token:
    file: ${STEERLOOP_TOKEN_FILE:-./secrets/relay-token}

volumes:
  relay-data:
  caddy-data:
  caddy-config:
