name: Feature proposal
description: Propose a bounded product or engineering improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security implications
      description: Note any new remote action, permission, or stored data.
    validations:
      required: true
