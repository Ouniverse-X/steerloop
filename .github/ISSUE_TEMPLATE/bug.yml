name: Bug report
description: Report a reproducible problem without including sensitive data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private source code, or real session transcripts.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and adapter.
    validations:
      required: true
